{% assign code_runner_id = include.runner_id | default: 'code-runner' %}
{% assign code_runner_language = include.language | default: 'python' %}
<div id="{{ code_runner_id }}" class="code-runner" data-language="{{ code_runner_language }}">
  <textarea id="{{ code_runner_id }}-editor" rows="8" spellcheck="false">{{ include.code | escape }}</textarea>
  <button type="button" id="{{ code_runner_id }}-run">Run code</button>
  <pre id="{{ code_runner_id }}-output" aria-live="polite"></pre>
  {% if include.success_gif %}
  <img id="{{ code_runner_id }}-success-gif" class="code-runner-success-gif" src="{{ site.baseurl }}{{ include.success_gif }}" alt="{{ include.success_gif_alt | default: 'Success!' }}" hidden>
  {% endif %}
</div>

<style>
  .pokedex:has(.code-runner) {
    background: #0f172a !important;
    color: #e2e8f0 !important;
  }

  .code-runner {
    background: #111827 !important;
    border: 1px solid #334155;
    border-radius: 0.75rem;
    margin: 1.5rem 0;
    padding: 1rem;
  }

  .code-runner textarea {
    box-sizing: border-box;
    display: block;
    font-family: monospace;
    margin-bottom: 0.75rem;
    padding: 0.75rem;
    width: 100%;
    background: #1e293b !important;
    border: 1px solid #475569;
    border-radius: 0.5rem;
    color: #263d2b !important;
    -webkit-text-fill-color: #263d2b;
    caret-color: #263d2b;
  }

  .code-runner button {
    background: #2563eb;
    border: 1px solid #60a5fa;
    border-radius: 0.5rem;
    color: #f8fafc;
    cursor: pointer;
    padding: 0.5rem 0.9rem;
  }

  .code-runner pre {
    background: #0b1220 !important;
    border: 1px solid #334155;
    border-radius: 0.5rem;
    color: #304b35 !important;
    min-height: 1.5rem;
    padding: 0.75rem;
    white-space: pre-wrap;
  }

  .code-runner-success-gif {
    border-radius: .5rem;
    display: block;
    margin-top: .75rem;
    max-width: 200px;
  }

  .code-runner-success-gif[hidden] {
    display: none;
  }

  .code-runner[data-language="python"] {
    background: #cfead2 !important;
    border-color: #6fae7d;
  }

  .pokedex:has(.code-runner[data-language="python"]) {
    background: #b9dfc0 !important;
  }

  .code-runner[data-language="python"] textarea {
    background: #e6f6e7 !important;
    border-color: #79b985;
    color: #21452b !important;
    -webkit-text-fill-color: #21452b;
    caret-color: #21452b;
  }

  .code-runner[data-language="python"] pre {
    background: #dcefe0 !important;
    border-color: #79b985;
    color: #285332 !important;
  }

  .code-runner[data-language="python"] button {
    background: #5a9f68;
    border-color: #3f7f52;
  }
</style>

<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
<script>
  (() => {
    const runner = document.getElementById('{{ code_runner_id }}');
    const editor = document.getElementById('{{ code_runner_id }}-editor');
    const runButton = document.getElementById('{{ code_runner_id }}-run');
    const output = document.getElementById('{{ code_runner_id }}-output');
    const successGif = document.getElementById('{{ code_runner_id }}-success-gif');

    function toText(chunk) {
      if (typeof chunk === 'number') return String.fromCharCode(chunk);
      if (typeof chunk === 'string') return chunk;
      if (chunk instanceof Uint8Array) return new TextDecoder().decode(chunk);
      return String(chunk);
    }

    runButton.addEventListener('click', async () => {
      output.textContent = 'Loading Python runtime...';
      if (successGif) successGif.hidden = true;

      try {
        window.codeRunnerPyodide = window.codeRunnerPyodide || loadPyodide();
        const pyodide = await window.codeRunnerPyodide;
        let text = '';

        // Use raw streams so input prompts (which often omit trailing newlines)
        // are captured and can be reused in the browser prompt dialog.
        pyodide.setStdout({ raw: (data) => { text += toText(data); } });
        pyodide.setStderr({ raw: (data) => { text += toText(data); } });
        pyodide.setStdin({
          stdin: () => {
            const lastLine = text.split('\n').pop();
            const promptText = (lastLine && lastLine.trim()) ? lastLine.trim() : 'Python input:';
            const response = window.prompt(promptText, '');
            if (response === null) {
              throw new Error('Input cancelled by user.');
            }
            return `${response}\n`;
          },
          isatty: true,
        });

        output.textContent = 'Running...';
        await pyodide.runPythonAsync(editor.value);
        output.textContent = text || '[No output]';
        if (successGif) successGif.hidden = false;
      } catch (error) {
        output.textContent = `Python Error: ${error}`;
      }
    });
  })();
</script>
